# Configuración de Cashapp (conexión con BankPlus)

# Símbolo de moneda que se muestra en la app
currency-symbol: "$"

# Placeholder de PlaceholderAPI que devuelve el saldo del banco (solo números enteros)
balance-placeholder: "%bankplus_balance_long%"

# Comando que se ejecuta como el jugador para enviar dinero.
# {player} = nombre del destinatario, {amount} = monto
pay-command: "bank pay {player} {amount}"
