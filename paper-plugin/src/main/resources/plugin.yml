name: Smartphone
version: '${version}'
main: com.smartphone.paper.SmartphonePlugin
api-version: '1.21'
description: Telefono para jugadores (mensajes, llamadas, contactos). Funciona junto al mod Smartphone.
softdepend: [PlasmoVoice, PlaceholderAPI, BankPlus]
commands:
  phone:
    description: Telefono
    usage: /phone number | /phone give [jugador]
permissions:
  smartphone.give:
    description: Permite dar telefonos con /phone give
    default: op
